name: refresh dashboard

on:
  schedule:
    # Once a day at 13:00 UTC. Monthly totals don't need more than this —
    # tighten it later if you want same-day updates after a stitching session.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual refresh from the Actions tab

permissions:
  contents: write

# Only one refresh runs at a time; if you trigger a new one while an older
# one is still going, the older one gets cancelled instead of the two
# racing to push and one of them failing.
concurrency:
  group: refresh-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          sudo curl -sL -o /usr/share/fonts/truetype/google-fonts/Lora-Variable.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/lora/Lora%5Bwght%5D.ttf"
          sudo fc-cache -f

      - name: Generate dash.png from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 main.py

      - name: Commit updated image
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dash.png
          git diff --cached --quiet && echo "no change" || git commit -m "refresh dashboard"
          git pull --rebase origin main
          git push
